plugins {
    id "com.github.johnrengelman.shadow" version "7.0.0"
}

apply plugin: 'java'
group 'github.saukiya'
version '4.0.0' + '-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()

    //Github Project
    maven { url "https://jitpack.io" }
    //MythicMobs
    maven { url "https://mvn.lumine.io/repository/maven-public/" }
    //bStats-bukkit
    maven { url "https://repo.codemc.io/repository/maven-public" }
}

dependencies {
    implementation 'org.bstats:bstats-bukkit:2.2.1'
    compileOnly fileTree('libs')
    compileOnly fileTree('lib')
    compileOnly 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'

    compileOnly 'com.gmail.filoghost.holographicdisplays:holographicdisplays-api:2.4.9'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.github.PlaceholderAPI:PlaceholderAPI:2.10.9'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}

shadowJar {
    // 过滤未使用的依赖
    minimize()
    // bStats重定向
    relocate('org.bstats', 'github.saukiya.sxitem.bstats')
}

//构建并拷贝
task buildLastJar(type: Copy) {
    dependsOn clean
    dependsOn shadowJar
    from shadowJar.archiveFile.get().asFile.path
    into("$rootDir").rename { "build/out/${project.name}-Latest.jar" }
}

task buildDebugJar(type: Copy) {
    dependsOn clean
    dependsOn shadowJar
    from shadowJar.archiveFile.get().asFile.path
    into("$rootDir/run/plugins").rename { "${project.name}-Debug.jar" }
}

//gradle 需要对文件中含有的'$'进行转义: $ -> \$
processResources {
    expand(version: version)
}
